[package]
name = "cabal-desktop"
version = "0.1.0"
description = "Cabal desktop workspace shell"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Handshake health-check + graceful-shutdown HTTP calls only (plain http://127.0.0.1, no TLS needed).
ureq = "2"

[profile.release]
strip = true
lto = true
